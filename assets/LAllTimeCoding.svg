<svg xmlns="http://www.w3.org/2000/svg" width="300" height="365" viewBox="0 0 500 608.333" role="img" aria-labelledby="title desc">
  <title id="title">All-Time Coding</title>
  <desc id="desc">All-time language hours combine a clearly labelled initial lifetime estimate with live WakaTime totals; SpireModH3 JSON is classified as C++.</desc>
  <style>
    .title { fill: #5a4028; font: 700 25px "Segoe UI", Ubuntu, sans-serif; }
    .language { fill: #d9e7ff; font: 400 17px "Segoe UI", Ubuntu, sans-serif; }
    .hours { fill: #d9e7ff; font: 400 16px "Segoe UI", Ubuntu, sans-serif; }
    .empty { fill: #d9e7ff; font: 400 15px "Segoe UI", Ubuntu, sans-serif; }
    .note { fill: #83a6d5; font: 400 13px "Segoe UI", Ubuntu, sans-serif; }
  </style>
  <rect x="0.5" y="0.5" width="499" height="607.333" rx="5" fill="#171a29" stroke="#394360"/>
  <text x="30" y="54" class="title">All-Time Coding</text>
  <text x="30" y="110" class="language">C#</text><rect x="30" y="128" width="345" height="12" rx="6" fill="#30374d"/><rect x="30" y="128" width="345.0" height="12" rx="6" fill="#5a4028"/><text x="470" y="140" class="hours" text-anchor="end">~3,780 h</text><text x="30" y="180" class="language">Python</text><rect x="30" y="198" width="345" height="12" rx="6" fill="#30374d"/><rect x="30" y="198" width="77.6" height="12" rx="6" fill="#a88465"/><text x="470" y="210" class="hours" text-anchor="end">~850 h</text><text x="30" y="250" class="language">Jupyter Notebook</text><rect x="30" y="268" width="345" height="12" rx="6" fill="#30374d"/><rect x="30" y="268" width="74.8" height="12" rx="6" fill="#46566f"/><text x="470" y="280" class="hours" text-anchor="end">~820 h</text><text x="30" y="320" class="language">C++</text><rect x="30" y="338" width="345" height="12" rx="6" fill="#30374d"/><rect x="30" y="338" width="59.3" height="12" rx="6" fill="#5d74a2"/><text x="470" y="350" class="hours" text-anchor="end">~650 h</text><text x="30" y="390" class="language">F#</text><rect x="30" y="408" width="345" height="12" rx="6" fill="#30374d"/><rect x="30" y="408" width="22.8" height="12" rx="6" fill="#688ac0"/><text x="470" y="420" class="hours" text-anchor="end">~250 h</text><text x="30" y="460" class="language">Mathematica</text><rect x="30" y="478" width="345" height="12" rx="6" fill="#30374d"/><rect x="30" y="478" width="19.2" height="12" rx="6" fill="#83a6d5"/><text x="470" y="490" class="hours" text-anchor="end">~210 h</text><text x="30" y="530" class="language">Uiua</text><rect x="30" y="548" width="345" height="12" rx="6" fill="#30374d"/><rect x="30" y="548" width="15.5" height="12" rx="6" fill="#d1e6fa"/><text x="470" y="560" class="hours" text-anchor="end">~170 h</text><text x="30" y="590" class="note">≈ initial lifetime estimate + live WakaTime updates</text>
